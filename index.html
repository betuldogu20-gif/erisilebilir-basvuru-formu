<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Başvuru Formu</title>
</head>
<body>
    <h1>Ders Başvuru Formu</h1>
    <form action="/basvuru" method="post">

    <fieldset>
        <legend>Kişisel Bilgiler</legend>
        <label for="ad">Ad Soyad *</label>
        <input type="text" id="ad" name="ad" autocomplete="name" required>

        <br><br>
        <label for="email">E-posta *</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <br><br>
        <label for="telefon">Telefon *</label>
        <input type="tel" id="telefon" name="telefon" autocomplete="tel" required>

        <br><br>
        <label for="dogum-tarihi">Doğum Tarihi *</label>
        <input type="date" id="dogum-tarihi" name="dogum_tarihi" required>

        <br><br>
        <label for="tc-no">TC Kimlik No</label>
        <input type="text" id="tc-no" name="tc_no" inputmode="numeric">

        <br><br>
        <label for="adres">Adres</label>
        <input type="text" id="adres" name="adres">

        <br><br>
        <label for="sehir">Şehir</label>
        <input type="text" id="sehir" name="sehir" autocomplete="address-level2">
        
        <br><br>
        <label for="posta-kodu">Posta Kodu</label>
        <input type="text" id="posta-kodu" name="posta_kodu" autocomplete="postal-code" inputmode="numeric" >
    </fieldset>

    <br>

    <fieldset>
        <legend>Ders Bilgileri</legend>

        <label for="ders">İlgilenilen ders *</label>
        <select id="ders" name="ders" required>
            <option value="">Lütfen bir ders seçiniz</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="react">React</option>
            <option value="git">Git ve Github</option>

        </select>

        <br><br>
    </fieldset>
    <fieldset>
        <legend>Deneyim Düzeyi *</legend>
        <label for="baslangic">Başlangıç</label>
        <input type="radio" id="baslangic" name="deneyim" value="baslangic" required>
        <label for="orta">Orta</label>
        <input type="radio" id="orta" name="deneyim" value="orta">
        <label for="ileri">İleri</label>
        <input type="radio" id="ileri" name="deneyim" value="ileri">

    </fieldset>

    <br>
    <fieldset>
        <label for="egitim">Mezuniyet / Eğitim Durumu</label>
        <input type="text" id="egitim" name="egitim" autocomplete="organization-title">

        <br><br>
        <label for="okul">Okul / Kurum</label>
        <input type="text" id="okul" name="okul" autocomplete="organization">

        <br><br>
        <label for="baslangic-tarihi">Eğitime başlamak istediğiniz tarih</label>
        <input type="date" id="baslangic-tarihi" name="baslangic_tarihi">

        <br><br>
        <label for="referans">Bizi nereden duydunuz?</label>
        <input type="text" id="referans" name="referans">

        <br><br>
        <label for="kullanici-adi">Kullanıcı Adı</label>
        <input type="text" id="kullanici-adi" name="kullanici-adi" autocomplete="username">
        
        <br><br>
        <label for="web-sitesi">Web sitesi</label>
        <input type="url" id="web-sitesi" name="web_sitesi" autocomplete="url">
    </fieldset>
    <br>
    <fieldset>
        <legend>Ek Bilgiler</legend>
        <label for="mesaj">Mesajınız *</label>
        <textarea name="mesaj" id="mesaj" rows="6" cols="40" required></textarea>

        <br><br>
        <label for="dosya">CV veya Belge</label>
        <input type="file" id="dosya" name="dosya">

        <br><br>
        <label for="renk">Tercih ettiğiniz renk</label>
        <input type="color" id="renk" name="renk">

        <br><br>
        <label for="saat">Tercih ettiğiniz ders saati</label>
        <input type="time" id="saat" name="saat">

        <br><br>
        <label for="hafta">Haftalık ayırabileceğiniz saat</label>
        <input type="number" id="hafta" name="hafta" min="1" max="40">

    </fieldset>

    <br>

    <fieldset>
        <legend>KVKK Onayı</legend>
        <label for="kvkk">KVKK metnini okudum ve onaylıyorum *</label>
        <input type="checkbox" id="kvkk" name="kvkk" value="onaylandi" required>
    </fieldset>
    
    <br>

    <button type="submit">Başvur</button>

    </form>
    
</body>
</html>
